# Staging only. Install as a drop-in for tateside-schematic-api-staging.service.
# Credentials and existing provider/MCP settings stay in private overrides.
[Service]
Environment=TATESIDE_DATA_DIR=/var/lib/tateside-schematic-staging
Environment=TATESIDE_DB_PATH=/var/lib/tateside-schematic-staging/tateside.db
Environment=TATESIDE_SCHEMATIC_REPOSITORY_PATH=/var/lib/tateside-schematic-staging/schematic-repository
Environment=JETBUILT_INDEX_PATH=/var/lib/tateside-schematic-staging/jetbuilt-index.json
Environment=OPENAI_QUOTE_RESEARCH_CACHE_PATH=/var/lib/tateside-schematic-staging/quote-research-cache.json
Environment=TATESIDE_DISABLE_SHAREPOINT=1
Environment=TATESIDE_REQUIRE_ACCESS_IDENTITY=1
Environment=TATESIDE_IMPORT_NORMALIZATION_ENABLED=1
Environment=TATESIDE_LIBRARY_AUDIT_ENABLED=1
Environment=TATESIDE_LIBRARY_DOCTOR_ENABLED=1
Environment=TATESIDE_DYNAMIC_TAXONOMY_ENABLED=1
