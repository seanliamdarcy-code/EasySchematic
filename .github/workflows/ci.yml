name: CI

on:
  push:
    branches: [master, staging, 'codex/staging-*', 'codex/production-*']
  pull_request:
    branches: [master, staging]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: TateSide API build and tests
        run: npm run tateside:api:build && node --test 'tateside-api/*.local.test.mjs'

      - name: MCP bridge build and tests
        run: npm ci --prefix mcp-server && npm test --prefix mcp-server

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser checks
        timeout-minutes: 5
        run: npx playwright test
